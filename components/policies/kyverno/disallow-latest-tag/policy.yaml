---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow :latest and Untagged Images
    policies.kyverno.io/category: Baseline Hygiene
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Mutable tags make rollbacks meaningless and audits impossible: what ran
      yesterday under :latest may not be what runs today. Requires an explicit
      tag or digest on every container image.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: "An explicit image tag or digest is required; ':latest' or untagged images are not allowed."
        # One entry per container list. Init and ephemeral containers are
        # separate fields, so checking only `containers` leaves the rule
        # trivially avoidable: an init container runs first, and an ephemeral
        # one is exactly what `kubectl debug` attaches.
        foreach:
          - list: "request.object.spec.containers[]"
            deny:
              conditions:
                any:
                  - key: "{{ element.image }}"
                    operator: Equals
                    value: "*:latest"
                  # Untagged means no tag and no digest on the *image name*,
                  # which is the part after the last slash. Testing the whole
                  # string for a colon gets this wrong whenever the registry
                  # carries a port: localhost:5001/app has a colon but no tag,
                  # and the runtime resolves it to :latest anyway.
                  - key: "{{ regex_match('^(.*/)?[^:@/]+$', element.image) }}"
                    operator: Equals
                    value: true
          - list: "request.object.spec.initContainers[]"
            deny:
              conditions:
                any:
                  - key: "{{ element.image }}"
                    operator: Equals
                    value: "*:latest"
                  - key: "{{ regex_match('^(.*/)?[^:@/]+$', element.image) }}"
                    operator: Equals
                    value: true
          - list: "request.object.spec.ephemeralContainers[]"
            deny:
              conditions:
                any:
                  - key: "{{ element.image }}"
                    operator: Equals
                    value: "*:latest"
                  - key: "{{ regex_match('^(.*/)?[^:@/]+$', element.image) }}"
                    operator: Equals
                    value: true
