---
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: disallow-latest-tag
policies:
  - ../policy.yaml
resources:
  - resources.yaml
results:
  - policy: disallow-latest-tag
    rule: require-image-tag
    resources: [good-pinned-tag, good-digest, good-port-tagged, good-init-pinned]
    kind: Pod
    result: pass
  - policy: disallow-latest-tag
    rule: require-image-tag
    resources:
      - bad-latest
      - bad-untagged
      - bad-port-untagged
      - bad-init-latest
      - bad-ephemeral-latest
    kind: Pod
    result: fail
