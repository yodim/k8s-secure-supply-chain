---
apiVersion: v1
kind: Pod
metadata:
  name: good-pinned-tag
spec:
  containers:
    - name: app
      image: ghcr.io/yodim/demo-app:1.4.2
---
apiVersion: v1
kind: Pod
metadata:
  name: good-digest
spec:
  containers:
    - name: app
      image: ghcr.io/yodim/demo-app@sha256:6a180828a1a3f95cbd74c9dfc1c5a29c07d1b74a4d3455d6bbcdd8f8b3d0b5a7
---
apiVersion: v1
kind: Pod
metadata:
  name: bad-latest
spec:
  containers:
    - name: app
      image: ghcr.io/yodim/demo-app:latest
---
apiVersion: v1
kind: Pod
metadata:
  name: bad-untagged
spec:
  containers:
    - name: app
      image: nginx
---
# Registry with a port and no tag. The runtime resolves this to :latest, but
# a whole-string colon test sees the port and calls it tagged.
apiVersion: v1
kind: Pod
metadata:
  name: bad-port-untagged
spec:
  containers:
    - name: app
      image: localhost:5001/app
---
# Same registry, genuinely tagged. Must still pass, or the port fix would
# just trade one false result for another.
apiVersion: v1
kind: Pod
metadata:
  name: good-port-tagged
spec:
  containers:
    - name: app
      image: localhost:5001/app:1.0
---
apiVersion: v1
kind: Pod
metadata:
  name: bad-init-latest
spec:
  initContainers:
    - name: setup
      image: ghcr.io/yodim/tools:latest
  containers:
    - name: app
      image: ghcr.io/yodim/demo-app:1.4.2
---
apiVersion: v1
kind: Pod
metadata:
  name: bad-ephemeral-latest
spec:
  containers:
    - name: app
      image: ghcr.io/yodim/demo-app:1.4.2
  ephemeralContainers:
    - name: debugger
      image: ghcr.io/yodim/debug-tools:latest
---
apiVersion: v1
kind: Pod
metadata:
  name: good-init-pinned
spec:
  initContainers:
    - name: setup
      image: ghcr.io/yodim/tools:2.1
  containers:
    - name: app
      image: ghcr.io/yodim/demo-app:1.4.2
