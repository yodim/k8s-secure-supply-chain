---
apiVersion: v1
kind: Pod
metadata:
  name: good-with-limits
  namespace: apps
spec:
  containers:
    - name: app
      image: ghcr.io/yodim/demo-app:1.4.2
      resources:
        limits:
          memory: 256Mi
          cpu: 250m
---
apiVersion: v1
kind: Pod
metadata:
  name: bad-no-limits
  namespace: apps
spec:
  containers:
    - name: app
      image: ghcr.io/yodim/demo-app:1.4.2
---
apiVersion: v1
kind: Pod
metadata:
  name: bad-memory-only
  namespace: apps
spec:
  containers:
    - name: app
      image: ghcr.io/yodim/demo-app:1.4.2
      resources:
        limits:
          memory: 256Mi
