---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require CPU and Memory Limits
    policies.kyverno.io/category: Baseline Hygiene
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      A workload without limits is a noisy-neighbor and a DoS vector waiting
      for traffic. Requires memory and CPU limits on every container.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-limits
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [apps]
      validate:
        message: "CPU and memory limits are required on all containers, including init containers."
        pattern:
          spec:
            # =() marks the field optional: checked when present, not required
            # to exist. Without this entry an init container could run
            # unbounded, and it runs before anything else in the Pod.
            #
            # ephemeralContainers is deliberately absent: Kubernetes forbids
            # setting resources on them, so requiring limits there would
            # reject every kubectl debug session rather than improve anything.
            =(initContainers):
              - resources:
                  limits:
                    memory: "?*"
                    cpu: "?*"
            containers:
              - resources:
                  limits:
                    memory: "?*"
                    cpu: "?*"
