---
apiVersion: kyverno.io/v1  # tested end-to-end via `make verify` (see README)
kind: ClusterPolicy
metadata:
  name: require-sbom-attestation
  annotations:
    policies.kyverno.io/title: Require SBOM Attestation
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Requires every image to carry an in-toto attestation containing a
      CycloneDX SBOM, signed by the trusted CI identity. Inventory becomes
      a precondition for running, not an afterthought.
spec:
  validationFailureAction: Enforce
  webhookTimeoutSeconds: 30
  failurePolicy: Fail
  rules:
    - name: verify-sbom-attestation
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [apps]
      verifyImages:
        - imageReferences:
            - "ghcr.io/yodim/*"
          # Optional. The demo packages are public, and Kyverno falls back to
          # an anonymous pull when this secret is absent, so a clean clone
          # verifies with no credential at all. Create it only for a private
          # registry: see docs/local-testing.md.
          imageRegistryCredentials:
            secrets:
              - ghcr-creds  # dockerconfigjson in the kyverno namespace
          # Enforcement comes from spec.validationFailureAction above. Kyverno
          # 1.13+ moves that to a per-rule `failureAction` here; on Kyverno
          # 1.12 (chart 3.2.x) the field is not in the CRD schema, so setting
          # it enforces nothing.
          attestations:
            - type: https://cyclonedx.org/bom
              attestors:
                - entries:
                    - keyless:
                        subject: "https://github.com/yodim/k8s-secure-supply-chain/.github/workflows/secure-build.yml@refs/heads/main"
                        issuer: "https://token.actions.githubusercontent.com"
                        rekor:
                          url: https://rekor.sigstore.dev
              conditions:
                - all:
                    # The attestation must actually contain a CycloneDX doc,
                    # not just claim the predicate type.
                    - key: "{{ bomFormat }}"
                      operator: Equals
                      value: "CycloneDX"
          # Kyverno defaults all three to true. Stated explicitly because
          # they are verification semantics, not operational knobs: silence
          # here would leave the guarantee resting on an upstream default.
          required: true
          mutateDigest: true
          verifyDigest: true
