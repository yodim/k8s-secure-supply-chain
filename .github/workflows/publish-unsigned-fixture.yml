---
# Publishes the deliberately unsigned test fixture used by the negative
# control in `make verify`. See tests/fixtures/unsigned-image/README.md.
#
# This workflow must NEVER sign, attest or scan what it pushes. Its entire
# value is being the one artifact in this repo that carries no provenance,
# so admission has something real to refuse. Do not "fix" it by reusing
# secure-build.yml.
name: publish-unsigned-fixture

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tests/fixtures/unsigned-image/**"
      - ".github/workflows/publish-unsigned-fixture.yml"

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # No id-token here: without it the job cannot obtain an OIDC token,
      # so it is structurally incapable of keyless signing.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push, unsigned
        uses: docker/build-push-action@v7
        with:
          context: tests/fixtures/unsigned-image
          file: tests/fixtures/unsigned-image/Dockerfile
          push: true
          # Fixed tag: the fixture is a constant, not a build artifact.
          tags: ghcr.io/yodim/k8s-secure-supply-chain/unsigned-fixture:1.0.0

      - name: Confirm no signature exists
        run: |
          echo "Pushed unsigned fixture. Admission must refuse it because it"
          echo "carries no signature, not because it cannot be resolved."
