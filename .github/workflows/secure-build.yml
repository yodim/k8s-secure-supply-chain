---
# Reusable secure-build workflow: build → SBOM → scan → sign → attest → push.
# Call it from any repo with one `uses:` line — see
# components/ci/github-actions/secure-build/README.md
name: secure-build

on:
  workflow_call:
    inputs:
      image-name:
        description: "Full image name without tag, e.g. ghcr.io/org/app"
        required: true
        type: string
      context:
        description: "Docker build context"
        required: false
        type: string
        default: "."
      dockerfile:
        description: "Path to Dockerfile"
        required: false
        type: string
        default: "Dockerfile"
      fail-on-severity:
        description: "Comma-separated Trivy severities that fail the build"
        required: false
        type: string
        default: "CRITICAL,HIGH"
    outputs:
      image-digest:
        description: "Immutable digest of the pushed image"
        value: ${{ jobs.build.outputs.digest }}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # OIDC token → Fulcio cert → keyless signature (ADR-0003)
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (local, not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          load: true
          tags: ${{ inputs.image-name }}:${{ github.sha }}

      # --- Inventory: what is in this image (permanent evidence, ADR-0004)
      - name: Generate SBOM (Syft, CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ inputs.image-name }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: true

      # --- Assessment: is anything in it currently known-vulnerable (build gate)
      - name: Scan (Trivy) — gate on ${{ inputs.fail-on-severity }}
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ inputs.image-name }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: ${{ inputs.fail-on-severity }}

      - name: Push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          push: true
          tags: ${{ inputs.image-name }}:${{ github.sha }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      # --- Provenance: sign and attest the digest, never the tag
      - name: Sign image (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "${{ inputs.image-name }}@${{ steps.push.outputs.digest }}"

      - name: Attest SBOM (in-toto, CycloneDX predicate)
        env:
          COSIGN_YES: "true"
        run: |
          cosign attest \
            --predicate sbom.cdx.json \
            --type cyclonedx \
            "${{ inputs.image-name }}@${{ steps.push.outputs.digest }}"
