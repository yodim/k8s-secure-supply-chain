---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"  # only after policies are enforcing
spec:
  project: default
  source:
    repoURL: https://github.com/yodim/k8s-secure-supply-chain
    targetRevision: main
    path: platform/apps/demo-app/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
