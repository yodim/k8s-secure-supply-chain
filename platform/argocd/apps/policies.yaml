---
# Pulls admission policies straight from the component catalog — the
# composition consumes components/, never the other way around.
# include glob picks up each policy.yaml; READMEs and test/ dirs are ignored.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: supply-chain-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/yodim/k8s-secure-supply-chain
    targetRevision: main
    path: components/policies/kyverno
    directory:
      recurse: true
      include: "*/policy.yaml"
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # ServerSideApply is deliberately NOT set here, unlike the kyverno app.
      # Kyverno strips managedFields from ClusterPolicy objects, and
      # server-side apply needs that ownership record to compute its patch.
      # Without it Argo reports "serverside-applied" and "successfully
      # synced" while the object is never touched: creates land, updates
      # vanish, and a policy silently stops tracking git after its first
      # apply. Proven by reverting a live policy and watching Argo sit
      # OutOfSync through several minutes of selfHeal without healing it.
      # The defaulted-field drift that SSA was originally added for is
      # handled by ignoreDifferences below, which is what actually fixed it.
      - RespectIgnoreDifferences=true
  # Kyverno defaults these on admission and they are absent from git, so the
  # policies would otherwise sit OutOfSync forever. Deliberately limited to
  # operational knobs: every field that carries verification meaning is
  # declared in the policies themselves, so real drift still surfaces.
  ignoreDifferences:
    - group: kyverno.io
      kind: ClusterPolicy
      jqPathExpressions:
        - .spec.admission
        - .spec.background
        - .spec.rules[].skipBackgroundRequests
        # The '?' is not decoration. Without it this expression raises
        # "Cannot iterate over null" on every policy that has no verifyImages
        # block, which is three of the five. A jq error here does not surface
        # as a sync failure: Argo reports "serverside-applied" and
        # "successfully synced" while the object is never actually updated,
        # so those policies silently stop tracking git after their first
        # apply. Creates work, updates do not, which is the worst shape a
        # GitOps bug can take.
        - .spec.rules[].verifyImages[]?.useCache
