---
# Pulls admission policies straight from the component catalog: the
# composition consumes components/, never the other way around.
# include glob picks up each policy.yaml; READMEs and test/ dirs are ignored.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: supply-chain-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/yodim/k8s-secure-supply-chain
    targetRevision: main
    path: components/policies/kyverno
    directory:
      recurse: true
      include: "*/policy.yaml"
  destination:
    server: https://kubernetes.default.svc
  # This app carries no syncOptions and no ignoreDifferences. Both are
  # deliberate, and both were arrived at the hard way.
  #
  # ServerSideApply=true is off because Kyverno strips managedFields from
  # ClusterPolicy objects, leaving SSA no ownership record to merge
  # against. It is also what made Kyverno's defaulted fields read as drift,
  # which is the only reason this app ever wanted ignoreDifferences.
  #
  # Kyverno defaults spec.admission, spec.background,
  # spec.rules[].skipBackgroundRequests and
  # spec.rules[].verifyImages[].useCache when it admits a policy. Under
  # client-side apply none of them read as drift, because Argo's three-way
  # merge only considers fields it set itself, so there is nothing left to
  # ignore.
  #
  # Ignoring them anyway is what broke policy updates for a week without
  # reporting a single error. RespectIgnoreDifferences=true does not just
  # filter the diff, it rewrites the manifest before the apply: Argo strips
  # the ignored paths from the live object, diffs the stripped copy against
  # live to recover their values, then applies that patch onto the manifest
  # from git. For a ClusterPolicy the patch is an RFC 7386 JSON merge
  # patch, because Argo has no strategic-merge schema for a kind outside
  # the Kubernetes scheme, and a JSON merge patch replaces a differing
  # array wholesale instead of merging it element by element. Two of those
  # four paths sit inside spec.rules[], so the entire rules array came back
  # from the cluster and overwrote the one from git. Argo then applied the
  # cluster's own policy to the cluster, truthfully logged "unchanged", and
  # left the app OutOfSync forever. Creates worked; every edit afterwards
  # was dropped in silence.
  #
  # scripts/check-sync-contract.sh fails CI if that pairing comes back. The
  # same pairing is safe on demo-app, where the kind is a built-in
  # Deployment and Argo uses a strategic merge patch that honours array
  # merge keys.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
